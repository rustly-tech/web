# Marks this repository as its own pnpm workspace root.
#
# Without it, pnpm walks up the filesystem looking for a workspace and can adopt
# an unrelated one - putting the lockfile and node_modules outside the
# repository, which leaves CI with no pnpm-lock.yaml to install from.
packages:
  - '.'

# A postinstall script is arbitrary code that runs on every developer machine
# and every CI runner, so pnpm refuses to run one unless it is named here.
# esbuild fetches its platform binary this way. Keep this list short and
# reviewed; adding to it is a supply-chain decision.
allowBuilds:
  esbuild: true
